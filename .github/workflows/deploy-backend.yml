name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build backend
        run: |
          cd backend
          cargo build --release

      - name: Create deployment package
        run: |
          cd backend
          mkdir -p deploy
          cp target/release/limitless-backend deploy/
          chmod +x deploy/limitless-backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/deploy/
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: deploy/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Stop the service first (before copying files)
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${USER}@${HOST} '
            sudo systemctl stop limitless-backend || true
          '

          # Create deployment directory on EC2
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${USER}@${HOST} '
            mkdir -p ~/limitless-backend
          '

          # Copy files to EC2 (now that service is stopped)
          scp -i private_key.pem -o StrictHostKeyChecking=no deploy/limitless-backend ${USER}@${HOST}:~/limitless-backend/

          # Start service
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${USER}@${HOST} '
            # Set correct permissions on binary
            cd ~/limitless-backend
            chmod +x limitless-backend
            
            # Update systemd service file with environment variables
            echo "[Unit]" | sudo tee /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Description=Limitless Backend Game Server" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "After=network.target" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "[Service]" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Type=simple" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "User=ubuntu" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "WorkingDirectory=/home/ubuntu/limitless-backend" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"AWS_REGION=us-east-1\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"DYNAMODB_TABLE_NAME=${{ secrets.DYNAMODB_TABLE_NAME }}\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"JWT_SECRET=${{ secrets.JWT_SECRET }}\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"DISCORD_REDIRECT_URI=${{ secrets.DISCORD_REDIRECT_URI }}\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"FRONTEND_URL=${{ secrets.FRONTEND_URL }}\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Environment=\"RUST_LOG=info\"" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "ExecStart=/home/ubuntu/limitless-backend/limitless-backend" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "Restart=always" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "RestartSec=10" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "[Install]" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            echo "WantedBy=multi-user.target" | sudo tee -a /etc/systemd/system/limitless-backend.service > /dev/null
            
            # Reload systemd and start the service
            sudo systemctl daemon-reload
            sudo systemctl start limitless-backend
            sudo systemctl enable limitless-backend
          '

          # Clean up
          rm -f private_key.pem

      - name: Verify deployment
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -i private_key.pem -o StrictHostKeyChecking=no ${USER}@${HOST} '
            sudo systemctl status limitless-backend
          '

          rm -f private_key.pem

      - name: Deployment summary
        run: |
          echo "✅ Backend deployed successfully to EC2!"
          echo "Backend URL: https://${{ secrets.EC2_HOST }}"
